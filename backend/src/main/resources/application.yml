server:
  port: ${PORT:${SERVER_PORT:8080}}
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/lercs;MODE=MySQL;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: ${H2_CONSOLE:false}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:5MB}
      max-request-size: ${MAX_REQUEST_SIZE:5MB}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
lercs:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-this-to-a-long-random-key-before-deployment-123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  upload-dir: ${UPLOAD_DIR:./uploads}
